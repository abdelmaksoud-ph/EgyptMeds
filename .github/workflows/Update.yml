name: DrugEye daily update

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 urllib3 gspread google-auth

      - name: Run incremental update
        run: python drugeye.py --auto

      - name: Sync to Google Sheets
        if: always()
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python sync_sheets.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "drugeye-bot"
          git config user.email "bot@users.noreply.github.com"
          git add drug_eye_output
          git diff --cached --quiet || git commit -m "Update $(date +%F)"
          git push
