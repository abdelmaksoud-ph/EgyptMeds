<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drug Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#e8f0f6;--card:#fff;--ink:#0b2540;--mute:#5b7088;--line:#cfdbe6;--g:#00a36c;--gi:#fff;--tag:#ffd84d;--tagi:#3a2f00;--up:#c81e3a;--down:#0a8f4f;--new:#1f5fd6;--alt:#7c3aed}
@media(prefers-color-scheme:dark){:root{--bg:#0a1626;--card:#11233a;--ink:#e6eef7;--mute:#8aa0b8;--line:#223a56;--g:#2ed3a0;--gi:#062418;--tag:#e9c53a;--tagi:#2b2300;--up:#ff8a9b;--down:#5fe3a1;--new:#8db4ff;--alt:#b69cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Cairo,"Segoe UI",Tahoma,sans-serif}
main{max-width:980px;margin:0 auto;padding:18px 16px 70px}
.bar{display:flex;align-items:center;gap:12px}
.bar svg{width:42px;height:42px;flex:none}
h1{font-size:1.5rem;font-weight:800;margin:0;flex:1}
button{font:inherit;color:inherit}
.lang{border:2px solid var(--ink);background:none;border-radius:999px;padding:1px 16px;font-weight:600;cursor:pointer}
.cap{display:flex;margin:20px 0 10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--ink)}
.cap .ic{background:var(--g);color:var(--gi);display:grid;place-items:center;width:66px;flex:none}
.cap input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:1.2rem;padding:14px 18px;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:1px 14px;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:is(.chip,.lang,.act):focus-visible{outline:3px solid var(--g);outline-offset:2px}
.tabs .chip{font-size:1rem;padding:4px 18px;font-weight:600}
.lbl{color:var(--mute);font-size:.85rem}
#meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--mute);font-size:.88rem;margin-top:6px}
#status{margin:12px 2px 8px;color:var(--mute)}
#list,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;align-items:start}
.item{background:var(--card);border:1px solid var(--line);border-inline-start:8px solid var(--g);border-radius:12px;padding:12px 14px;cursor:pointer;min-width:0}
.item.up{border-inline-start-color:var(--up)}.item.nw{border-inline-start-color:var(--new)}
.item.open{grid-column:1/-1}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:800;font-size:1.03rem;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.tag{position:relative;background:var(--tag);color:var(--tagi);font-weight:800;padding:0 12px;padding-inline-start:22px;border-radius:6px;white-space:nowrap;text-align:center;line-height:1.3;flex:none}
.tag::before{content:"";position:absolute;inset-inline-start:7px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--card)}
.tag s{display:block;font-size:.75rem;font-weight:600;opacity:.75}
.ai{display:inline-block;direction:ltr;border:1.5px solid var(--g);border-radius:999px;padding:0 10px;font-size:.86rem;font-weight:600;margin:2px 0}
.cat{color:var(--mute);font-size:.82rem;direction:ltr;text-align:start}
.bd,.dl{display:block;font-size:.84rem;margin-top:3px;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}.nwc{color:var(--new)}
.item.up,.item.nw{color:inherit}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.act{border:1.5px solid var(--g);background:none;border-radius:8px;padding:0 10px;font-size:.84rem;font-weight:600;cursor:pointer}
.act.alt{border-color:var(--alt)}
.act.on{background:var(--g);color:var(--gi)}.act.alt.on{background:var(--alt);color:#fff}
.more{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.item.open .more{display:block}
.uf{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;direction:ltr}
.uf span{background:var(--bg);border-radius:6px;padding:0 8px;font-size:.84rem}
.hist{font-size:.88rem;margin-bottom:8px}
.info{white-space:pre-line;color:var(--mute);font-size:.9rem;direction:ltr;text-align:left}
.pnl{margin-top:10px;padding:10px;background:var(--bg);border-radius:10px;cursor:default}
.pnl h3{margin:0 0 8px;font-size:.95rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
mark{background:#fde68a;color:#000;border-radius:3px}
@media(max-width:520px){.cap .ic{width:52px}.cap input{font-size:1.05rem}}
</style>
</head>
<body>
<main>
<div class="bar">
  <svg viewBox="0 0 48 48" aria-hidden="true"><g transform="rotate(-40 24 24)"><rect x="4" y="15" width="40" height="18" rx="9" fill="#fff"/><path d="M24 15h11a9 9 0 0 1 0 18H24z" fill="#00a36c"/><rect x="4" y="15" width="40" height="18" rx="9" fill="none" stroke="currentColor" stroke-width="3"/></g></svg>
  <h1 data-i="title"></h1>
  <button class="lang" id="lang" aria-label="Language"></button>
</div>
<label class="cap">
  <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></span>
  <input id="q" type="search" autocomplete="off" autofocus>
</label>
<div class="chips" id="scope">
  <span class="lbl" data-i="searchIn"></span>
  <button class="chip on" data-s="all" data-i="sAll"></button>
  <button class="chip" data-s="name" data-i="sName"></button>
  <button class="chip" data-s="act" data-i="sAct"></button>
</div>
<div class="chips" id="ex">
  <span class="lbl" data-i="try"></span>
  <button class="chip" data-q="para*">para*</button>
  <button class="chip" data-q="amox*cl">amox*cl</button>
  <button class="chip" data-q="keto">keto</button>
  <button class="chip" data-q="&lt;20">&lt;20</button>
  <button class="chip" data-q="20-50">20-50</button>
</div>
<div class="chips tabs" id="tabs">
  <button class="chip on" data-v="search" data-i="tSearch"></button>
  <button class="chip" data-v="changes" data-i="tChanges"></button>
  <button class="chip" data-v="new" data-i="tNew"></button>
</div>
<div id="meta"></div>
<div id="status"></div>
<div id="list"></div>
</main>

<script>
// Data files committed by the daily update (same repo, same origin).
const D="eg_drugs_data/",URLS={json:D+"drug_details.json",csv:D+"drug_details.csv",history:D+"price_history.csv",newp:D+"new_products.csv"};
const MAX=60;
const L={
en:{title:"Drug Search",ph:"Name, active ingredient or price",searchIn:"Search in:",sAll:"Everything",sName:"Name",sAct:"Active ingredient",try:"Try:",
 tSearch:"Search",tChanges:"Price changes",tNew:"New products",welcome:"Type a name, the start of a word, or a price range. Use * as a wildcard.",
 loading:"Loading...",err:"Could not load the data. Check that eg_drugs_data/drug_details.json exists in the repo.",
 products:"products",updated:"Updated",results:"results",showing:"showing first",none:"No results.",
 noCh:"No price changes recorded yet.",noNew:"No new products recorded yet.",hist:"Price history",to:"to",cur:"L.E",
 chg:"products with price changes",nw:"new products",added:"Added",btn:"العربية",was:"was",
 sim:"Similars",alt:"Alternatives",wide:"Wider class",cheaper:"cheaper by",pricier:"more by",usedFor:"Used for",
 simT:"Same active ingredient",altT:"Same use",noSim:"No other product with this active ingredient.",noAlt:"No alternatives found.",more:"more"},
ar:{title:"البحث عن الأدوية",ph:"الاسم أو المادة الفعالة أو السعر",searchIn:"ابحث في:",sAll:"الكل",sName:"الاسم",sAct:"المادة الفعالة",try:"جرّب:",
 tSearch:"بحث",tChanges:"تغيّر الأسعار",tNew:"أدوية جديدة",welcome:"اكتب الاسم أو بداية الكلمة أو نطاق سعر. استخدم * بدل أي حروف.",
 loading:"جارٍ التحميل...",err:"تعذّر تحميل البيانات. تأكد من وجود ملف eg_drugs_data/drug_details.json.",
 products:"دواء",updated:"آخر تحديث",results:"نتيجة",showing:"عرض أول",none:"لا توجد نتائج.",
 noCh:"لا توجد تغييرات في الأسعار بعد.",noNew:"لا توجد أدوية جديدة بعد.",hist:"سجل الأسعار",to:"إلى",cur:"ج.م",
 chg:"دواء تغيّر سعره",nw:"دواء جديد",added:"أضيف في",btn:"English",was:"كان",
 sim:"المثيلات",alt:"البدائل",wide:"فئة أوسع",cheaper:"أرخص بـ",pricier:"أغلى بـ",usedFor:"الاستخدامات",
 simT:"نفس المادة الفعالة",altT:"نفس الاستخدام",noSim:"لا يوجد دواء آخر بنفس المادة الفعالة.",noAlt:"لا توجد بدائل.",more:"المزيد"}
};
let S={lang:"en",view:"search",scope:"all"},P=[],hist=[],newp=[],lastUpdate="",ready=false;
const chBy=new Map(),nwBy=new Map(),byAct=new Map(),byCat=new Map(),byCls=new Map(),byName=new Map();
try{S.lang=localStorage.getItem("lang")||((navigator.language||"").slice(0,2)==="ar"?"ar":"en")}catch(e){S.lang=(navigator.language||"").slice(0,2)==="ar"?"ar":"en"}
const T=k=>L[S.lang][k],$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rxe=s=>s.replace(/[.+?^${}()|[\]\\]/g,"\\$&");
const num=s=>{const m=String(s).match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN};
const fp=(raw)=>{const n=num(raw);return isNaN(n)?esc(raw||""):n+" "+T("cur")};
const digits=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const add=(m,k,v)=>{if(!k)return;if(!m.has(k))m.set(k,[]);m.get(k).push(v)};

function parseCSV(t){const o=[];let r=[],f="",q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){r.push(f);f=""}
  else if(c=='\n'){r.push(f);o.push(r);r=[];f=""}else if(c!='\r')f+=c}
 if(f||r.length){r.push(f);o.push(r)}return o}
async function csv(u){try{const res=await fetch(u);if(!res.ok)return[];const d=parseCSV(await res.text());const h=d[0].map(x=>x.trim().toLowerCase());
 return d.slice(1).filter(r=>r.some(x=>x)).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||""])))}catch(e){return[]}}
async function json(u){try{const res=await fetch(u);if(!res.ok)return null;return Object.values(await res.json())}catch(e){return null}}

function mk(r){
 const info=r.information||"",act=((info.match(/^\s*About\s+([^^]+)/i)||[])[1]||"").trim(),catK=(r.category||"").toLowerCase().trim();
 const ind=((info.match(/Indications? for[^^]*\^+([^]*?)(?:\^\^|$)/i)||[])[1]||"").split("^").map(s=>s.replace(/^\s*\d+[.)]\s*/,"").trim()).filter(Boolean).slice(0,10);
 return{name:r.name,price:num(r.price),raw:r.price,info,act,ind,cat:(r.category||"").replace(/\./g," / "),catK,cls:catK.split(".")[0],
  actK:act.toLowerCase().replace(/\s+/g," "),nameL:r.name.toLowerCase(),actL:act.toLowerCase(),hay:(r.name+" "+act+" "+r.category+" "+info).toLowerCase()}}

async function load(){
 $("status").textContent=T("loading");
 const [j,h,n]=await Promise.all([json(URLS.json),csv(URLS.history),csv(URLS.newp)]);
 const rows=j||await csv(URLS.csv);
 if(!rows.length){$("status").textContent=T("err");return}
 P=rows.filter(r=>r.name).map(mk);
 P.forEach((p,i)=>{p.i=i;byName.set(p.name,p);add(byAct,p.actK,p);add(byCat,p.catK,p);add(byCls,p.cls,p)});
 const srt=(a,b)=>(b.timestamp||b.date||"").localeCompare(a.timestamp||a.date||"");
 hist=h.sort(srt);newp=n.sort(srt);
 hist.forEach(r=>add(chBy,r.product,r));newp.forEach(r=>{if(!nwBy.has(r.product))nwBy.set(r.product,r)});
 lastUpdate=hist[0]?hist[0].date:"";ready=true;meta();run();
}

function applyLang(){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
 $("q").placeholder=T("ph");$("lang").textContent=T("btn");document.title=T("title");meta();run();
}
function meta(){$("meta").innerHTML=ready?`<span>${P.length.toLocaleString()} ${T("products")}</span>`+(lastUpdate?`<span>${T("updated")}: ${esc(lastUpdate)}</span>`:""):""}

function build(input){
 const tests=[],bodies=[];
 for(const tok of digits(input).toLowerCase().split(/\s+/).filter(Boolean)){let m;
  if(m=tok.match(/^<(\d+(\.\d+)?)$/)){const v=+m[1];tests.push({p:x=>x.price<=v});continue}
  if(m=tok.match(/^>(\d+(\.\d+)?)$/)){const v=+m[1];tests.push({p:x=>x.price>=v});continue}
  if(m=tok.match(/^(\d+(\.\d+)?)-(\d+(\.\d+)?)$/)){const a=+m[1],b=+m[3];tests.push({p:x=>x.price>=a&&x.price<=b});continue}
  const body=tok.split("*").map(rxe).join("[^ ]*");tests.push({re:new RegExp("(^|[^a-z0-9])"+body)});bodies.push(body)}
 return{tests,hl:bodies.length?new RegExp("(?<![a-z0-9])(?:"+bodies.join("|")+")","ig"):null}}
function mark(s,hl){if(!hl)return esc(s);let o="",l=0;
 for(const m of s.matchAll(hl)){if(!m[0])continue;o+=esc(s.slice(l,m.index))+"<mark>"+esc(m[0])+"</mark>";l=m.index+m[0].length}
 return o+esc(s.slice(l))}

const byPrice=(a,b)=>(isNaN(a.price)?1e9:a.price)-(isNaN(b.price)?1e9:b.price);
const sims=p=>(byAct.get(p.actK)||[]).filter(x=>x!==p&&p.actK).sort(byPrice);
function alts(p,wide){const seen={};return((wide?byCls:byCat).get(wide?p.cls:p.catK)||[]).filter(x=>x.actK!==p.actK).sort(byPrice)
 .filter(x=>(seen[x.actK]=(seen[x.actK]||0)+1)<=3)}
const nAlt=p=>p.catK?(byCat.get(p.catK)||[]).filter(x=>x.actK!==p.actK).length:0;
function delta(p,x){if(!p||isNaN(p.price)||isNaN(x.price)||p.price===x.price)return"";
 const d=x.price-p.price;return `<span class="dl ${d<0?"down":"up"}">${d<0?T("cheaper"):T("pricier")} ${+Math.abs(d).toFixed(2)} (${Math.abs(d/p.price*100).toFixed(0)}%)</span>`}

function badge(c){const a=num(c.old_price),b=num(c.new_price),up=b>a;
 return `<span class="bd ${up?"up":"down"}">${fp(c.old_price)} ${T("to")} ${fp(c.new_price)} (${c.date})</span>`}

function card(p,hl,ctx){
 const ch=chBy.get(p.name)||[],c=ch[0],nw=nwBy.get(p.name),up=c&&num(c.new_price)>num(c.old_price);
 const price=c?`<span class="tag"><s>${T("was")} ${fp(c.old_price)}</s>${fp(p.raw)}</span>`:`<span class="tag">${fp(p.raw)}</span>`;
 const ns=sims(p).length,na=nAlt(p);
 const hs=ch.length?`<div class="hist"><strong>${T("hist")}</strong>${ch.map(x=>`<div>${esc(x.date)}: ${fp(x.old_price)} ${T("to")} ${fp(x.new_price)}</div>`).join("")}</div>`:"";
 return `<div class="item ${up?"up":nw?"nw":""}" data-i="${p.i}">
  <div class="top"><span class="name">${mark(p.name,hl)}</span>${price}</div>
  ${p.act?`<div class="ai">${mark(p.act,hl)}</div>`:""}${p.cat?`<div class="cat">${esc(p.cat)}</div>`:""}
  ${ctx?delta(ctx,p):""}${nw?`<span class="bd nwc">${T("added")} ${esc(nw.date)}</span>`:""}
  <div class="acts">${ns?`<button class="act" data-k="sim">${T("sim")} (${ns})</button>`:""}${na?`<button class="act alt" data-k="alt">${T("alt")} (${na})</button>`:""}</div>
  <div class="more">${p.ind.length?`<div class="uf"><strong>${T("usedFor")}:</strong>${p.ind.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}${hs}<div class="info">${esc(p.info.replace(/\^+/g,"\n").trim())}</div></div>
  </div>`}

function panel(it,kind){
 const p=P[+it.dataset.i];let pn=it.querySelector(":scope>.pnl");
 const same=pn&&pn.dataset.k===kind;if(pn)pn.remove();
 it.querySelectorAll(":scope>.acts .act").forEach(b=>b.classList.toggle("on",!same&&b.dataset.k===kind));
 if(same)return;
 const wide=kind==="wide",list=kind==="sim"?sims(p):alts(p,wide);
 pn=document.createElement("div");pn.className="pnl";pn.dataset.k=kind;
 const title=kind==="sim"?`${T("simT")}: ${esc(p.act)}`:`${T("altT")}: ${esc(wide?p.cls:p.cat)}`;
 const bw=kind!=="sim"&&!wide&&p.cls&&p.cls!==p.catK?`<button class="act alt" data-k="wide">${T("wide")}</button>`:"";
 pn.innerHTML=`<h3>${title}${bw}</h3>`+(list.length?`<div class="grid">${list.slice(0,40).map(x=>card(x,null,p)).join("")}</div>`:`<div class="lbl">${T(kind==="sim"?"noSim":"noAlt")}</div>`);
 it.appendChild(pn);it.classList.add("open");
}

function run(){
 if(!ready)return;
 const input=$("q").value.trim(),list=$("list"),st=$("status"),{tests,hl}=build(input);
 const field=p=>S.scope==="name"?p.nameL:S.scope==="act"?p.actL:p.hay;
 const ok=p=>tests.every(t=>t.p?t.p(p):t.re.test(field(p)));
 let hits;
 if(S.view==="search"){
  if(!input){list.innerHTML="";st.textContent=T("welcome");return}
  const f=digits(input).toLowerCase().split(/\s+/)[0].replace(/\*/g,"");
  hits=P.filter(ok).sort((a,b)=>(a.nameL.startsWith(f)?0:1)-(b.nameL.startsWith(f)?0:1)||a.name.localeCompare(b.name));
  st.textContent=hits.length?hits.length.toLocaleString()+" "+T("results")+(hits.length>MAX?` (${T("showing")} ${MAX})`:""):T("none");
 }else{
  const src=S.view==="changes"?hist:newp,names=[...new Set(src.map(r=>r.product))];
  if(!names.length){list.innerHTML="";st.textContent=T(S.view==="changes"?"noCh":"noNew");return}
  hits=names.map(n=>byName.get(n)).filter(p=>p&&(!input||ok(p)));
  st.textContent=hits.length.toLocaleString()+" "+T(S.view==="changes"?"chg":"nw")+(hits.length>MAX?` (${T("showing")} ${MAX})`:"");
 }
 list.innerHTML=hits.slice(0,MAX).map(p=>card(p,hl)).join("");
}

$("list").onclick=e=>{
 const it=e.target.closest(".item");if(!it)return;
 const b=e.target.closest("[data-k]");
 if(b){const own=b.closest(".item");panel(own,b.dataset.k);return}
 const pn=e.target.closest(".pnl");if(pn&&pn.parentElement===it)return;
 it.classList.toggle("open")};
let t;
$("q").addEventListener("input",()=>{clearTimeout(t);t=setTimeout(run,120)});
$("lang").onclick=()=>{S.lang=S.lang==="ar"?"en":"ar";try{localStorage.setItem("lang",S.lang)}catch(e){}applyLang()};
$("scope").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;S.scope=b.dataset.s;
 document.querySelectorAll("#scope [data-s]").forEach(x=>x.classList.toggle("on",x===b));run()};
$("tabs").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;S.view=b.dataset.v;
 document.querySelectorAll("#tabs [data-v]").forEach(x=>x.classList.toggle("on",x===b));run()};
$("ex").onclick=e=>{const b=e.target.closest("[data-q]");if(!b)return;$("q").value=b.dataset.q;S.view="search";
 document.querySelectorAll("#tabs [data-v]").forEach(x=>x.classList.toggle("on",x.dataset.v==="search"));run()};
applyLang();load();
</script>
</body>
</html>
